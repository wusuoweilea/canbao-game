<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>残堡征途</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* 设计：整局游戏是一扇教堂彩窗。黑铅条勾边，宝石色玻璃，你占领的领地一块块亮成金色。 */
:root {
  color-scheme: dark;
  --lead: #09080c;
  --night: #121018;
  --pane: #1c1924;
  --pane2: #272230;
  --line: #3b3444;
  --vellum: #f0e6cc;
  --dim: #a99f8b;
  --gold: #eab33b;
  --ruby: #d13a48;
  --cobalt: #4a86e8;
  --emerald: #35b27c;
  --display: "ZCOOL XiaoWei", "STKaiti", "Kaiti SC", "KaiTi", "Noto Serif SC", serif;
  --body: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--lead); color: var(--vellum); font: 14px/1.5 var(--body); overflow: hidden; }
body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#app { height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* 按钮：一小块玻璃 */
.btn { background: var(--pane2); border: 2px solid var(--lead); box-shadow: inset 0 0 0 1px var(--line); padding: 6px 12px; min-height: 36px; border-radius: 2px; white-space: nowrap; }
.btn:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--gold); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.gold { background: linear-gradient(170deg, #f4c95c, #c98a1c); color: #241703; font-weight: 700; box-shadow: inset 0 0 0 1px #ffe6a3; }
.btn.ruby { background: linear-gradient(170deg, #c9303f, #7b1320); color: #ffe9e0; box-shadow: inset 0 0 0 1px #ef7d80; }
.btn.small { min-height: 30px; padding: 2px 8px; font-size: 13px; }

/* 标题页 */
.title { position: relative; height: 100%; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #241a2e 0%, var(--lead) 75%); }
.title .win { position: absolute; inset: 0; display: grid; place-items: center; opacity: .95; }
.title .win svg { width: 112%; height: 112%; }
.title .win polygon { animation: dawn 3.2s ease-out both; animation-delay: var(--d); }
@keyframes dawn { from { filter: brightness(.45); } to { filter: brightness(1); } }
.title .card { position: relative; z-index: 1; text-align: center; padding: 18px 28px; background: rgba(9, 8, 12, .78); border: 3px solid var(--lead); outline: 1px solid var(--gold); max-width: min(92vw, 640px); max-height: 94%; overflow: auto; }
.title h1 { font-size: clamp(44px, 11vmin, 84px); line-height: 1.05; letter-spacing: .14em; margin-right: -.14em; color: var(--gold); }
.title p { margin: 6px 0 12px; color: var(--vellum); }
.title .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.starters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; text-align: left; }
.starter { background: var(--pane); border: 2px solid var(--lead); box-shadow: inset 0 0 0 1px var(--line); padding: 26px 10px 10px; border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
.starter:hover { box-shadow: inset 0 0 0 1px var(--gold); }
.starter h3 { font-size: 18px; color: var(--gold); }
.starter small { display: block; color: var(--dim); line-height: 1.4; }
@media (max-width: 520px) { .starters { grid-template-columns: 1fr; } .starter { border-radius: 2px; padding: 8px 10px; } .ptstart { float: left; margin: 0 8px 0 0; width: 74px; height: 60px; } }

/* 主界面 */
.game { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.top { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; padding: 5px 12px; background: var(--night); border-bottom: 2px solid var(--lead); box-shadow: 0 1px 0 var(--line); }
.top .date { font-family: var(--display); font-size: 17px; color: var(--gold); margin-right: 4px; }
.r { display: inline-flex; gap: 4px; align-items: baseline; white-space: nowrap; font-variant-numeric: tabular-nums; }
.r b { font-family: var(--display); font-weight: 400; color: var(--dim); }
.r i { font-style: normal; font-size: 11px; color: var(--emerald); }
.r i.neg { color: var(--ruby); }
.top .sp { flex: 1; }
.iconbtn { background: none; border: 0; color: var(--dim); padding: 2px 6px; min-height: 28px; }
.iconbtn:hover { color: var(--gold); }
.iconbtn.devon { color: var(--gold); }
.main { position: relative; overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px; background: var(--night); }
.main.flush { padding: 0; overflow: hidden; }
.endbtn { min-height: 32px; padding: 2px 12px; margin-left: 2px; }
.main.go-in .scene { animation: goin .42s ease-out both; }
.main.go-out .wview { animation: goout .42s ease-out both; }
@keyframes goin { from { transform: scale(.72); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes goout { from { transform: scale(1.34); opacity: 0; } to { transform: none; opacity: 1; } }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; align-items: start; }
.sec h2 { font-size: 19px; color: var(--gold); margin-bottom: 6px; }
.sec + .sec { margin-top: 12px; }
.hint { color: var(--dim); font-size: 13px; margin: 0 0 6px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--pane); border: 1px solid var(--lead); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03); min-height: 44px; }
.row + .row { margin-top: 3px; }
.row .grow { flex: 1; min-width: 0; }
.row .name { font-family: var(--display); font-size: 16px; }
.row small { display: block; color: var(--dim); line-height: 1.35; }
.price { font-size: 12px; color: var(--dim); }
.price .no { color: var(--ruby); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .btn { width: 34px; padding: 0; min-height: 32px; }
.stepper b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 400; }
.lv { color: var(--gold); font-size: 13px; }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border: 1px solid var(--line); color: var(--dim); }
.tag.bad { border-color: var(--ruby); color: #ff9c9c; }
.tag.ok { border-color: var(--emerald); color: #8fe3bd; }

.pt { flex: 0 0 56px; width: 56px; height: 56px; }
.ptbig { display: block; width: 120px; height: 98px; margin: -18px auto 2px; }
.ptstart { display: block; width: 100px; height: 82px; margin: -20px auto 2px; }
.heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.hero { background: var(--pane); border: 2px solid var(--lead); box-shadow: inset 0 0 0 1px var(--line); padding: 26px 12px 10px; border-radius: 50% 50% 0 0 / 28px 28px 0 0; display: flex; flex-direction: column; gap: 3px; }
.hero h3 { font-size: 18px; color: var(--gold); }
.hero p { margin: 0; font-size: 13px; color: var(--vellum); }
.hero p span { color: var(--dim); }
.shape { display: inline-grid; gap: 1px; grid-auto-rows: 9px; grid-auto-columns: 9px; vertical-align: middle; margin-left: 6px; }
.shape i { background: var(--gold); }

/* 彩窗地图 */
.wview { position: absolute; inset: 0; background: #1a4476; overflow: hidden; }
.wview::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 52%, transparent 58%, rgba(6, 8, 24, .5) 100%); }
.wview .coach { top: auto; bottom: 10px; }
.wview .alerts { bottom: auto; top: 10px; }
.wscroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; scrollbar-width: none; }
.wscroll::-webkit-scrollbar { display: none; }
.wboard { --u: 1; position: relative; flex: 0 0 auto; margin: auto; }
.wsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wback { position: absolute; right: 16px; top: 14px; z-index: 4; }
.wt { cursor: pointer; }
.wt .tint { fill: var(--c); fill-opacity: .16; transition: fill-opacity .15s; }
.wt.neu .tint { fill-opacity: 0; }
.wt.me .tint { fill-opacity: .26; }
.wt .bord { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; pointer-events: none; }
.wt.neu .bord { stroke: #2a1c10; stroke-opacity: .5; stroke-width: 1.6; stroke-dasharray: 5 5; }
.wt.can .bord { stroke: #ffe39a; stroke-width: 3.6; stroke-dasharray: none; stroke-opacity: 1; animation: can 1.8s ease-in-out infinite; }
.wt.sel .tint { fill-opacity: .42; }
.wt.sel .bord { stroke: #fff; stroke-width: 4; stroke-dasharray: none; stroke-opacity: 1; }
.wt.home .bord { stroke-width: 4; }
.wt.fresh { animation: fresh 2.2s ease-out; }
@media (hover: hover) { .wt:hover .tint { fill-opacity: .36; } }
.wsvg text { font-family: var(--display); font-size: calc(var(--u) * 15px); fill: #fff6df; paint-order: stroke; stroke: #000; stroke-width: calc(var(--u) * 3.4px); stroke-linejoin: round; pointer-events: none; text-anchor: middle; }
.wsvg text.me { fill: #ffe08a; }
.wsvg text.sub { font-family: var(--body); font-size: calc(var(--u) * 11px); fill: #e0d6bd; stroke-width: calc(var(--u) * 2.6px); }
.lm { pointer-events: none; }
.lm polygon { stroke: var(--lead); stroke-width: 1; stroke-linejoin: round; }
.lmsh { fill: rgba(0, 0, 0, .3); }
.terr .edge { fill: transparent; stroke: var(--lead); stroke-width: 6; stroke-linejoin: round; }
.terr.can .edge { stroke: #ffe39a; stroke-width: 3; animation: can 1.8s ease-in-out infinite; }
.terr.sel .edge { stroke: #fff; stroke-width: 4; }
@keyframes can { 50% { stroke-opacity: .35; } }
.terr.fresh { animation: fresh 2.2s ease-out; }
@keyframes fresh { 0% { filter: brightness(3.2); } 100% { filter: brightness(1); } }
.alertdot { fill: none; stroke: #ff4d4d; stroke-width: 4; animation: can 1s ease-in-out infinite; pointer-events: none; }
.coach { position: absolute; z-index: 1; left: 12px; top: 10px; max-width: min(46%, 300px); background: rgba(9, 8, 12, .8); padding: 6px 10px; border-left: 3px solid var(--gold); font-size: 13px; pointer-events: none; }
.alerts { position: absolute; z-index: 1; left: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 3px; max-width: 60%; pointer-events: none; }
.alerts div { background: rgba(70, 8, 16, .9); border-left: 3px solid var(--ruby); padding: 2px 8px; font-size: 13px; }
.sheet { position: absolute; z-index: 3; right: 10px; top: 10px; bottom: 10px; width: min(300px, 46%); background: rgba(16, 14, 22, .96); border: 3px solid var(--lead); outline: 1px solid var(--line); padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.sheet h2 { font-size: 22px; color: var(--gold); }
.sheet p { margin: 0; font-size: 13px; }
.sheet .foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.sheet .foot .btn { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--dim); }

/* 城堡活景 */
.scene { position: absolute; inset: 0; overflow: hidden; background: #1f3024; }
.sscroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; scrollbar-width: none; }
.sscroll::-webkit-scrollbar { display: none; }
.sboard { position: relative; flex: 0 0 auto; margin: auto; }
.s3d { position: absolute; inset: 0; transform-origin: 50% 100%; }
.scenecv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bds { position: absolute; inset: 0; }
.bds.dragging { opacity: 0; pointer-events: none; }
.bd { position: absolute; background: none; border: 0; padding: 0; display: flex; align-items: flex-end; justify-content: center; }
.bd span { display: inline-flex; gap: 4px; align-items: baseline; padding: 0 6px; background: rgba(9, 8, 12, .74); border-left: 2px solid var(--line); font-family: var(--display); font-size: 13px; line-height: 19px; white-space: nowrap; }
.bd i { font: 400 11px var(--body); font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.bd.off span { opacity: .78; }
.bd.off i { color: var(--dim); }
.bd.up span { border-left-color: var(--gold); }
.bd:hover span, .bd.on span { background: var(--gold); color: #241703; border-left-color: #ffe6a3; }
.bd:hover i, .bd.on i { color: #241703; }
.chips { position: absolute; z-index: 1; left: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 3px; max-width: 64%; pointer-events: none; }
.chips span { background: rgba(9, 8, 12, .74); padding: 0 8px; font-size: 12px; line-height: 21px; }
.chips span:first-child { color: var(--gold); font-family: var(--display); font-size: 14px; }
.sheet.flip { right: auto; left: 10px; }
.bigbtn { min-height: 44px; font-family: var(--display); font-size: 17px; }
.scene .coach { top: auto; bottom: 10px; }
.scene .alerts { bottom: auto; top: 60px; }
.sheet.wide { width: min(640px, 64%); }
.sheet.wide .foot { position: sticky; bottom: -10px; margin: 4px -12px -10px; padding: 8px 12px; background: rgba(16, 14, 22, .98); border-top: 1px solid var(--line); flex: 0 0 auto; }
.sheet .sec h2 { font-size: 18px; }
.sheet > * { flex: 0 0 auto; }
.sheet .foot { flex: 1 0 auto; align-items: flex-end; }
.sheet .row { background: rgba(255, 255, 255, .03); }
.sheet .stepper .btn { width: 30px; }
.sheet .stepper b { min-width: 28px; }
.yard { position: relative; height: clamp(84px, 20vh, 150px); margin: -10px -12px 10px; border-bottom: 2px solid var(--lead); background: var(--pane); overflow: hidden; }
.yardcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 布阵 */
.dep { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--night); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.dephead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 5px 10px; border-bottom: 2px solid var(--lead); box-shadow: 0 1px 0 var(--line); }
.dephead .where { font-family: var(--display); font-size: 17px; color: var(--gold); }
.dephead .sp { flex: 1; }
.cmd { font-variant-numeric: tabular-nums; }
.cmd.over { color: var(--ruby); }
.depbody { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 0; }
.roster { overflow-y: auto; touch-action: pan-y; padding: 6px; display: flex; flex-direction: column; gap: 3px; border-right: 2px solid var(--lead); }
.rost { display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: var(--pane); border: 2px solid var(--lead); text-align: left; min-height: 38px; cursor: grab; flex: 0 0 auto; touch-action: pan-y; }
.rost.sel { box-shadow: inset 0 0 0 2px var(--gold); }
.rost.none { opacity: .4; }
.rost canvas { width: 30px; height: 30px; flex: 0 0 30px; pointer-events: none; }
.rost .t { flex: 1; min-width: 0; line-height: 1.2; pointer-events: none; }
.rost small { color: var(--dim); display: block; font-size: 11px; }
.rost .c { font-variant-numeric: tabular-nums; pointer-events: none; color: var(--gold); }
.fieldwrap { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.strip { min-height: 40px; padding: 4px 10px; font-size: 13px; background: var(--pane); border-top: 2px solid var(--lead); display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
.strip b { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 15px; }
.ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -120%); background: var(--gold); color: #241703; padding: 2px 8px; font-size: 13px; }
@media (orientation: portrait) {
  .depbody { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .fieldwrap { grid-row: 1; }
  .roster { grid-row: 2; flex-direction: row; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; border-right: 0; border-top: 2px solid var(--lead); }
  .rost { touch-action: pan-x; flex: 0 0 132px; }
  .sheet { left: 10px; right: 10px; top: auto; width: auto; max-height: 52%; }
  .sheet.flip { left: 10px; right: 10px; top: 10px; bottom: auto; }
  .sheet.wide, .sheet.wide.flip { width: auto; left: 10px; right: 10px; top: 10px; bottom: 10px; max-height: none; }
  .coach { top: auto; bottom: 10px; max-width: calc(100% - 24px); }
  .alerts { bottom: auto; top: 10px; max-width: calc(100% - 24px); }
}

/* 战斗 */
.bat { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--lead); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 4px 12px; background: var(--night); }
.hud .timer { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--vellum); font-variant-numeric: tabular-nums; }
.hud .timer.low { color: var(--ruby); }
.hud .count { font-size: 13px; color: var(--dim); }
.bossbar { text-align: right; min-width: 0; }
.bossbar .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bossbar .bar { height: 7px; background: #3a1016; border: 1px solid var(--lead); }
.bossbar .fill { height: 100%; background: var(--ruby); width: 100%; }
.warn { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(120, 10, 22, .92); border: 2px solid var(--lead); outline: 1px solid #ff8d8d; padding: 3px 14px; font-family: var(--display); font-size: 18px; white-space: nowrap; pointer-events: none; animation: warn .5s ease-in-out infinite alternate; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.warn small { font-family: var(--body); font-size: 12px; margin-left: 8px; color: #ffd9c9; }
@keyframes warn { to { background: rgba(170, 24, 36, .95); } }
.skills { display: flex; gap: 6px; padding: 5px 10px; background: var(--night); align-items: stretch; }
.hb { --e: 0; position: relative; flex: 0 1 170px; min-width: 0; min-height: 50px; background: var(--pane); border: 2px solid var(--lead); box-shadow: inset 0 0 0 1px var(--line); text-align: left; padding: 3px 8px 8px; touch-action: none; overflow: hidden; }
.hb::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: calc(var(--e) * 1%); background: var(--cobalt); }
.hb .a { display: block; font-family: var(--display); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .b { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb.ready { box-shadow: inset 0 0 0 2px var(--gold); background: #3a2a10; animation: ready 1s ease-in-out infinite alternate; }
.hb.ready::after { background: var(--gold); }
@keyframes ready { to { background: #54401a; } }
.hb.aiming { outline: 2px solid #fff; }
.hb.down { opacity: .4; }
.skills .sp { flex: 1; }
.skills .btn { min-width: 58px; }

/* 结算、月报、弹窗 */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 8, .72); display: grid; place-items: center; padding: 14px; }
.modal { background: var(--night); border: 3px solid var(--lead); outline: 1px solid var(--gold); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.modal h2 { font-size: 24px; color: var(--gold); }
.modal h2.bad { color: var(--ruby); }
.modal p { margin: 0; }
.modal ul { margin: 0; padding-left: 18px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.modal .big { font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .title .win polygon, .terr.can .edge, .terr.fresh, .wt.can .bord, .wt.fresh, .warn, .hb.ready, .alertdot, .main.go-in .scene, .main.go-out .wview { animation: none; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* 残堡征途 · 规则层：数据、经营、大地图、战斗模拟。不碰 DOM，可在 bun 里跑平衡测试。 */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* 维诺图：先把彩窗外框（椭圆）逐条按中垂线裁开，顺便得到相邻关系 */
function buildCells() {
  const frame = [];
  for (let i = 0; i < 44; i++) { const a = i / 44 * Math.PI * 2; frame.push([500 + 492 * Math.cos(a), 280 + 276 * Math.sin(a)]); }
  const cells = [];
  const adj = MAP.map(() => new Set());
  MAP.forEach((m, i) => {
    let poly = frame.slice();
    const from = [];
    MAP.forEach((o, j) => {
      if (i === j) return;
      const mx = (m.x + o.x) / 2, my = (m.y + o.y) / 2, nx = o.x - m.x, ny = o.y - m.y;
      const side = p => (p[0] - mx) * nx + (p[1] - my) * ny;
      const out = [];
      poly.forEach((p, k) => {
        const q = poly[(k + 1) % poly.length], sp = side(p), sq = side(q);
        if (sp <= 0) out.push(p);
        if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
      });
      poly = out;
      from.push([j, mx, my, nx, ny]);
    });
    from.forEach(([j, mx, my, nx, ny]) => {
      const n = Math.hypot(nx, ny);
      const on = poly.filter(p => Math.abs((p[0] - mx) * nx + (p[1] - my) * ny) / n < .01);
      if (on.length >= 2 && Math.hypot(on[0][0] - on[1][0], on[0][1] - on[1][1]) > 12) { adj[i].add(j); adj[j].add(i); }
    });
    cells.push(poly);
  });
  return { cells, adj: adj.map(s => [...s]) };
}
const { cells: CELLS, adj: ADJ } = buildCells();

    if (zz.k === 'row' || zz.row) { g.fillRect(0, Y(zz.y - 1.5), V.bw, s * 3); g.strokeRect(-4, Y(zz.y - 1.5), V.bw + 8, s * 3); }
    else if (zz.k === 'area' || zz.area) { g.fillRect(X(zz.x - 1.5), Y(zz.y - 1.5), s * 3, s * 3); g.strokeRect(X(zz.x - 1.5), Y(zz.y - 1.5), s * 3, s * 3); }
    else { g.beginPath(); g.arc(X(zz.x), Y(zz.y), zz.r * s, 0, 7); g.fill(); g.stroke(); }
  };
  if (z) zoneRect(z, .16 + .14 * Math.sin(t * 12));
  if (U.aim) { g.save(); const a = U.aim; g.fillStyle = 'rgba(234,179,59,.26)'; g.strokeStyle = '#ffe39a'; g.lineWidth = 2; if (a.kind === 'row') { g.fillRect(0, Y(a.y - 1.5), V.bw, s * 3); g.strokeRect(-4, Y(a.y - 1.5), V.bw + 8, s * 3); } else { g.fillRect(X(a.x - 1.5), Y(a.y - 1.5), s * 3, s * 3); g.strokeRect(X(a.x - 1.5), Y(a.y - 1.5), s * 3, s * 3); } g.restore(); }
  B.units.filter(u => u.kind === 'wall' && u.hp > 0).forEach(u => {
    const x = X(u.x) - s / 2, y = Y(u.y) - s / 2, c = u.hp / u.max;
    stroke(g, 2); g.fillStyle = c > .5 ? '#8b8582' : '#5f5a57'; g.fillRect(x, y, s, s); g.strokeRect(x, y, s, s);
    g.fillStyle = '#a5a09b'; for (let i = 0; i < 2; i++) { g.fillRect(x + s * (.12 + i * .46), y + s * .1, s * .32, s * .28); g.strokeRect(x + s * (.12 + i * .46), y + s * .1, s * .32, s * .28); }
    bar(g, x + 3, y + s - 6, s - 6, c, '#c9c3b4');
  });
  const list = B.units.filter(u => u.hp > 0 && u.kind !== 'wall').sort((a, b) => a.y - b.y);
  for (const u of list) {
    const dir = u.side ? -1 : 1, lung = u.lunge > 0 ? Math.sin((u.lunge / .22) * Math.PI) * s * .22 * dir : 0;
    const bob = u.moving ? Math.abs(Math.sin(u.walk)) * s * .07 : 0;
    const x = X(u.x) + lung, y = Y(u.y) - bob, pose = u.lunge > 0 ? 1 : u.moving && Math.sin(u.walk) > 0 ? 2 : 0;
    drawFoot(g, X(u.x), Y(u.y) + s * .38, u.hero ? s * .7 : s * .36);
    if (u.mod.hold > 0 || u.mod.rally > 0) { g.strokeStyle = u.mod.hold > 0 ? '#7fb2ff' : '#ffd86b'; g.lineWidth = 2; g.beginPath(); g.ellipse(X(u.x), Y(u.y) + s * .36, s * .42, s * .17, 0, 0, 7); g.stroke(); }
    if (u.hero) {
      if (u.wind) { g.strokeStyle = '#ff5252'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, s * 1.05, -1.57, -1.57 + 6.28 * (1 - u.wind.t / u.wind.T)); g.stroke(); }
      drawHero(g, u.hid, u.side, x, y, s * 1.55, u.side ? B.fac : null, pose);
      bar(g, x - s * .7, y - s * 1, s * 1.4, u.hp / u.max, u.side ? '#ff6b6b' : '#ffd86b', 5);
    } else {
      drawUnitAt(g, u.kind, u.side, u.rank, x, y, u.side ? B.fac : null, u.w, pose);
      if (u.hp < u.max) bar(g, x - s * .36, y - s * .56, s * .72, u.hp / u.max, u.side ? '#ff6b6b' : '#8fe3bd', 3);
    }
  }
  g.lineCap = 'round';
  for (const a of B.shots) {
    const k = a.t / a.dur, x = a.x + (a.tx - a.x) * k, y = a.y + (a.ty - a.y) * k - Math.sin(k * Math.PI) * .5;
    const ang = Math.atan2(a.ty - a.y, a.tx - a.x);
    if (a.splash) { g.fillStyle = '#8d8d8d'; stroke(g, 2); circle(g, X(x), Y(y) - Math.sin(k * Math.PI) * s, s * .18, '#8d8d8d'); continue; }
    g.strokeStyle = '#efe4c8'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(X(x), Y(y)); g.lineTo(X(x) - Math.cos(ang) * s * .34, Y(y) - Math.sin(ang) * s * .34); g.stroke();
  }
  for (const r of fx.rains) { g.strokeStyle = 'rgba(255,236,190,.85)'; g.lineWidth = 1.4; const seed = seeded(Math.round(r.x * 99 + r.y * 7)); for (let i = 0; i < 26; i++) { const px = X(r.x + (seed() - .5) * 3), py = Y(r.y + (seed() - .5) * 3), d = (1 - r.t / .4) * s; g.beginPath(); g.moveTo(px + d, py - d); g.lineTo(px + d * .6 + s * .3 * .2, py - d * .6); g.stroke(); } }
  for (const r of fx.rings) { const k = r.t / .5; g.strokeStyle = ['rgba(255,226,150,', 'rgba(127,178,255,', 'rgba(143,227,189,'][r.c] + (1 - k) + ')'; g.lineWidth = 3; g.beginPath(); g.arc(X(r.x), Y(r.y), r.r * s * (.5 + .5 * k), 0, 7); g.stroke(); }
  for (const d of fx.dashes) { g.strokeStyle = `rgba(255,120,110,${1 - d.t / .4})`; g.lineWidth = s * .9; g.beginPath(); g.moveTo(X(d.x0), Y(d.y0)); g.lineTo(X(d.x1), Y(d.y1)); g.stroke(); }
  for (const p of fx.shards) {
    g.save(); g.translate(X(p.x), Y(p.y)); g.rotate(p.a); g.globalAlpha = clamp(p.life * 2, 0, 1); const R = p.r * s;
    g.fillStyle = p.col; g.strokeStyle = '#000'; g.lineWidth = .8; g.beginPath(); g.moveTo(0, -R); g.lineTo(R, R * .7); g.lineTo(-R * .8, R * .4); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
  const ff = getComputedStyle(document.body).fontFamily;
  g.textAlign = 'center';
  for (const f of fx.floats) {
    if (f.t < 0) continue;
    g.globalAlpha = 1 - f.t / .9; g.font = `${f.big ? 'bold ' : ''}${Math.max(11, s * (f.big ? .42 : .3))}px ${ff}`;
    g.lineWidth = 3; g.strokeStyle = '#000'; const y = Y(f.y) - f.t * s * .8; g.strokeText(f.v, X(f.x), y); g.fillStyle = f.col; g.fillText(f.v, X(f.x), y); g.globalAlpha = 1;
  }
  if (U.paused) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, V.bw, V.bh); }
}
function bar(g, x, y, w, k, col, h = 3) { g.fillStyle = '#000'; g.fillRect(x - 1, y - 1, w + 2, h + 2); g.fillStyle = col; g.fillRect(x, y, w * clamp(k, 0, 1), h); }

function finishBattle(outcome) {
  cancelAnimationFrame(U.raf);
  const R = settle(S, U.ctx, U.B, outcome);
  U.R = R; U.screen = 'game';
  if (R.taken) { U.fresh = U.ctx.terr; }
  U.tab = U.ctx.mode === 'siege' ? 'castle' : 'map'; U.sel = null; U.csel = null; // 出征回到世界地图看战果，守城留在主堡
  if (U.ctx.mode === 'siege') clearAway(S);
  save();
  U.modal = resultModal(R);
  U.dep = null; U.B = null;
  render();
}
function resultModal(R) {
  const names = list => { const c = {}; list.forEach(u => { c[UNITS[u].n] = (c[UNITS[u].n] || 0) + 1; }); return Object.keys(c).map(k => k + ' ' + c[k]).join('，'); };
  const siege = R.ctx.mode === 'siege';
  const title = siege ? (R.outcome === 'win' ? '守住了灰鸦堡' : '城门被攻破') : R.outcome === 'win' ? `攻占${R.taken}` : R.outcome === 'retreat' ? '部队撤回' : '进攻失败';
  const li = [];
  li.push(R.dead.length ? `阵亡 ${R.dead.length} 人：${names(R.dead)}${R.retreatLoss ? `（其中后卫 ${R.retreatLoss} 人断后）` : ''}` : '无人阵亡');
  if (R.wounded.length) li.push(`重伤 ${R.wounded.length} 人，已送回医院`);
  if (R.promoted) li.push(`${R.promoted} 名士兵晋升`);
  if (R.heroHurt.length) li.push(`${R.heroHurt.map(h => HEROES[h].n).join('、')}重伤，需回城休养`);
  if (R.heroLv.length) li.push(`${R.heroLv.map(h => HEROES[h].n).join('、')}升级`);
  if (R.lordUp) { const [c, r] = lordGrid(S.lord.lv); li.push(`领主升至 ${S.lord.lv} 级：${c}×${r} 格，统御 ${lordCmd(S)}，英雄位 ${lordHeroes(S.lord.lv)}`); }
  const loot = Object.keys(R.loot).map(k => `${RES[k]} +${R.loot[k]}`).join('，');
  if (loot) li.push(`战利品：${loot}${R.pop ? `，人口 +${R.pop}` : ''}`);
  if (R.capture) li.push(`俘虏了${HEROES[R.capture].n}，可以进城到英雄殿招降`);
  if (R.unlock) li.push(`${HEROES[R.unlock].n}逃走了，可以在英雄殿招募`);
  if (R.fell) li.push(`${FAC[R.fell].n}覆灭`);
  if (R.razed) li.push(`${R.razed}被毁，资源被掠走三成半。城破 ${S.breach}/3 次`);
  return { title, bad: R.outcome !== 'win', html: `<ul class="big">${li.map(x => `<li>${x}</li>`).join('')}</ul>`, foot: `<button class="btn gold" data-a="closeResult">回到大地图</button>` };
}

/* ───────── 操作 ───────── */
const A = {
  newGame() { U.starter = true; render(); },
  cont() { if (loadSave()) { U.screen = 'game'; U.tab = 'castle'; resume(); } },
  start(e) { S = newGame(e.dataset.k); UID = 100; S.troops.forEach(t => { t.id = UID++; }); U.screen = 'game'; U.tab = 'castle'; U.starter = false; save(); render(); },
  tab(e) { goTo(e.dataset.v); },
  bpick(e) { const k = e.dataset.k; U.csel = U.csel === k ? null : k; sfx.click(); render(); },
  closeB() { U.csel = null; render(); },
  resetBase() { Scene.reset(); save(); sfx.click(); render(); },
  dev() { // 开发者模式：粮木铁金花不完，关掉后回到打开前的数目
    if (S.dev) { S.res = S.dev; S.dev = null; } else { S.dev = { ...S.res }; }
    save(); sfx.click(); render();
  },
  sound() { U.sound = !U.sound; if (U.sound) audio(); render(); },
  help() { U.modal = { title: '玩法', html: HELP + '<p><button class="btn small ruby" data-a="restart">放弃存档，重新开局</button></p>' }; render(); },
  restart() { U.modal = { title: '放弃这一局？', bad: true, html: '<p>当前存档会被删除，不能恢复。</p>', foot: '<button class="btn" data-a="closeModal">取消</button><button class="btn ruby" data-a="restartYes">删除存档</button>' }; render(); },
  restartYes() { wipe(); S = null; U.modal = null; U.screen = 'title'; U.starter = true; render(); },
  closeModal() { const n = U.modal && U.modal.next; U.modal = null; if (n) n(); else render(); },
  closeResult() { U.modal = null; if (S.won || S.lost) { U.screen = 'end'; } render(); },
  terr(e) { const i = +e.closest('[data-t]').dataset.t; if (MAP[i].type === 'home') { goTo('castle'); return; } U.sel = U.sel === i ? null : i; render(); },
  closeSheet() { U.sel = null; render(); },
  sortie() { if (!S.sortie && attackable(S, U.sel)) { const t = U.sel; U.sel = null; openDeploy('attack', t); } },
  garAdd() {
    const pool = S.troops.filter(s => !s.wound && !s.away && UNITS[s.u].cls === 'inf').sort((a, b) => a.rank - b.rank);
    if (!pool.length) return;
    S.troops.splice(S.troops.indexOf(pool[0]), 1); S.t[U.sel].gar++; S.garTotal++; save(); render();
  },
  garSub() { if (S.t[U.sel].gar > 0) { S.t[U.sel].gar--; S.garTotal--; S.troops.push(newSoldier('inf')); save(); render(); } },
  work(e) {
    const k = e.dataset.k, d = +e.dataset.d, v = S.work[k] + d;
    if (v < 0 || v > workerCap(S, k) || (d > 0 && idle(S) <= 0)) return;
    S.work[k] = v; render();
  },
  build(e) {
    const k = e.dataset.k, c = bldCost(S, k);
    if (!canPay(S, c)) return;
    if (!S.bld[k] && landUsed(S) >= landMax(S)) return;
    pay(S, c); S.bld[k]++; sfx.click(); Scene.built(k, `${BUILD[k].n} ${S.bld[k]} 级`); save(); U.csel = null; render();
  },
  castle() { const c = CASTLE_COST[S.castle]; if (c && canPay(S, c)) { pay(S, c); S.castle++; sfx.horn(); Scene.built('keep', `主堡 ${S.castle} 级`); save(); U.csel = null; render(); } },
  reclaim() { const c = reclaimCost(S); if (canPay(S, c)) { pay(S, c); S.reclaim++; Scene.land(); save(); render(); } },
  train(e) {
    const k = e.dataset.k, d = UNITS[k];
    if (!canPay(S, d.price) || S.trained >= trainMax(S) || S.pop <= 1) return;
    pay(S, d.price); S.pop--; S.trained++; const s = newSoldier(k); S.troops.push(s); Scene.recruit(s.id); fixWork(S); sfx.click(); save(); render();
  },
  refit(e) {
    const k = e.dataset.k, d = UNITS[k], s = S.troops.filter(x => x.u === d.base && !x.wound && !x.away).sort((a, b) => b.rank - a.rank)[0];
    if (!s || S.res.iron < (d.price.iron || 0)) return;
    S.res.iron -= d.price.iron || 0; s.u = k; sfx.click(); save(); render();
  },
  recruit(e) { const id = e.dataset.k, d = HEROES[id], c = d.cost || d.surrender || 150; if (S.res.gold >= c) { S.res.gold -= c; S.heroes.push(newHero(id)); S.pool = S.pool.filter(x => x !== id); sfx.horn(); save(); render(); } },
  persuade(e) { const id = e.dataset.k, c = HEROES[id].surrender; if (S.res.gold >= c && !S.persuade) { S.res.gold -= c; S.persuade = { id, left: 2 }; S.captives = S.captives.filter(x => x !== id); save(); render(); } },
  endTurn() {
    const r = endTurn(S), inc = r.inc; Scene.month(inc);
    const siege = r.siege || S.alerts.find(a => a.eta <= 0 && a.target === 0);
    if (!siege) clearAway(S);
    save();
    const line = Object.keys(RES).map(k => `<span class="r"><b>${RES[k]}</b>${inc[k] >= 0 ? '+' : ''}${inc[k]}</span>`).join(' &nbsp; ');
    U.modal = {
      title: dateText(), html: `<p>${line}</p>${r.log.length ? `<ul>${r.log.map(l => `<li>${l}</li>`).join('')}</ul>` : '<p class="hint">大陆上这个月没有大事。</p>'}${siege ? `<p><span class="tag bad">${FAC[siege.fac].n}兵临城下，必须迎战</span></p>` : ''}`,
      foot: `<button class="btn ${siege ? 'ruby' : 'gold'}" data-a="closeModal">${siege ? '上城迎敌' : '继续'}</button>`,
      next: siege ? () => openDeploy('siege', null, siege) : null,
    };
    U.sel = null; if (S.lost) U.screen = 'end';
    render();
  },
  depBack() { U.dep = null; U.screen = 'game'; render(); },
  depAuto() { U.dep.pick = null; autoFill(); refreshDeploy(); },
  depClear() { U.dep.items = []; U.dep.pick = null; refreshDeploy(); },
  scout() { if (S.res.gold >= 15) { S.res.gold -= 15; U.dep.scouted = true; refreshDeploy(); } },
  surrender() {
    const D = U.dep, B = makeBattle({ cols: D.cols, rows: D.rows, items: [] }, D.foe, { defense: true });
    U.ctx = { mode: 'siege', alert: D.alert }; U.B = B;
    finishBattle('lose');
  },
  fight() { if (U.dep.items.length && deployCmd(U.dep.items) <= U.dep.cmdMax) startBattle(); },
  pause() { U.paused = !U.paused; const b = $('#pz'); if (b) b.textContent = U.paused ? '继续' : '暂停'; U.last = performance.now(); },
  retreat() {
    U.paused = true;
    U.modal = { title: '撤退？', bad: true, html: '<p>能保住剩余兵力，但后卫会再损失 15%。这次出征算失败。</p>', foot: '<button class="btn" data-a="retreatNo">继续打</button><button class="btn ruby" data-a="retreatYes">撤退</button>' };
    mountModal();
  },
  retreatNo() { U.modal = null; U.paused = false; U.last = performance.now(); mountModal(); },
  retreatYes() { U.modal = null; finishBattle(U.B.defense ? 'lose' : 'retreat'); },
};
function mountModal() {
  const old = $('.overlay'); if (old) old.remove();
  if (U.modal) app().insertAdjacentHTML('beforeend', modalHTML());
}
function resume() {
  const pending = S.alerts.find(a => a.eta <= 0 && a.target === 0);
  if (pending) { openDeploy('siege', null, pending); return; }
  if (S.won || S.lost) U.screen = 'end';
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !el.dataset.a) return;
  audio();
  const f = A[el.dataset.a]; if (f) f(el);
});
document.addEventListener('keydown', e => {
  if (U.screen !== 'battle') return;
  if (e.key === ' ') { e.preventDefault(); A.pause(); }
  const n = +e.key;
  if (n >= 1 && n <= 3) { const b = document.querySelectorAll('.hb')[n - 1]; if (b) { const u = U.B.units.find(x => x.id === +b.dataset.h); if (u && u.energy >= 100 && u.hp > 0) { const sk = SKILLS[HEROES[u.hid].skill]; if (sk.aim) U.aim = { u, kind: sk.aim, x: U.B.boss.x, y: U.B.boss.y, sticky: true }; else if (playerCast(U.B, u)) sfx.cut(); } } }
  if (e.key === 'Escape') U.aim = null;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && U.screen === 'battle' && !U.paused) A.pause(); });
addEventListener('resize', () => { if (U.screen === 'game') render(); if (U.screen === 'title') render(); });

/* ───────── 画面切换 ───────── */
function renderTitle() {
  const starters = ['sword', 'arch', 'gen'].map(k => { const d = HEROES[k], s = SKILLS[d.skill]; return `<button class="starter" data-a="start" data-k="${k}"><canvas class="ptstart" width="200" height="164" data-md="h:${k}" aria-hidden="true"></canvas><h3>${d.n}${shapeHTML(d.shape)}</h3><small>${s.n}：${s.d}</small><small>${d.txt}</small></button>`; }).join('');
  const cont = hasSave() ? '<button class="btn gold" data-a="cont">继续征途</button>' : '';
  app().innerHTML = `<div class="title"><div class="win">${windowSVG({ title: true })}</div><div class="card"><h1>残堡征途</h1><p>${U.starter ? '选一位陪你从破堡起家的老部下' : '一座破堡，一块块点亮整片大陆。'}</p>
    ${U.starter ? `<div class="starters">${starters}</div>` : `<div class="acts">${cont}<button class="btn ${cont ? '' : 'gold'}" data-a="newGame">新的征途</button></div>`}</div></div>`;
}
function renderEnd() {
  const win = S.won, n = owned(S).length;
  app().innerHTML = `<div class="title"><div class="win">${windowSVG({ owner: i => S.t[i].own, title: true })}</div><div class="card"><h1>${win ? '彩窗已满' : '残堡陷落'}</h1><p>${win ? `第 ${S.turn} 个月，灰鸦旗插上了最后一座敌都。` : `城门第三次被攻破，灰鸦家族的名字从大陆上消失。`}</p>
    <p class="num">领地 ${n} 块 · 歼敌 ${S.kills} · 阵亡 ${S.lostMen} · 领主 ${S.lord.lv} 级</p><div class="acts"><button class="btn gold" data-a="restartYes">再来一局</button></div></div></div>`;
}
function render() {
  if (U.screen === 'title') renderTitle();
  else if (U.screen === 'game') renderGame();
  else if (U.screen === 'deploy') renderDeploy();
  else if (U.screen === 'battle') renderBattle();
  else if (U.screen === 'end') renderEnd();
  Models.paint();
}
function start(data) {
  if (data && data.S) { adopt(data.S); U.screen = 'game'; resume(); } else render();
}
window.claude?.hot?.snapshot?.(() => (S ? { S } : {}));
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (U.screen === 'title') render(); });

</script>
